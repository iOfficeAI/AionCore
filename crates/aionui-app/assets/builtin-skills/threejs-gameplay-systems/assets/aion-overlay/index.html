<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111312" />
    <title>Short crossing</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="Playable Three.js game canvas"></canvas>
      <section id="hud" aria-live="polite">
        <img id="hud-icon" alt="" hidden width="36" height="36" />
        <div class="hud-metric">
          <span>Marks</span>
          <strong><span id="score-value">0</span>/<span id="target-value">8</span></strong>
        </div>
        <div class="hud-metric">
          <span>Time</span>
          <strong id="timer-value">00:00</strong>
        </div>
        <div id="chapter-line">Approach</div>
        <div id="status-line">Find the first marks</div>
      </section>
      <div id="touch-controls" aria-hidden="true">
        <div id="touch-stick">
          <div id="touch-knob"></div>
        </div>
        <button id="dash-button" type="button">Dash</button>
      </div>
      <section id="pause-overlay" hidden>
        <div class="overlay-card">
          <h2>Paused</h2>
          <p id="share-status"></p>
          <div class="overlay-actions">
            <button id="resume-button" type="button">Continue</button>
            <button id="share-button" type="button">Share</button>
          </div>
        </div>
      </section>
      <section id="settle-overlay" hidden>
        <div class="overlay-card">
          <h2>Brought home</h2>
          <p id="settle-share-status"></p>
          <div class="overlay-actions">
            <button id="replay-button" type="button">Play again</button>
            <button id="settle-share-button" type="button">Share</button>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
